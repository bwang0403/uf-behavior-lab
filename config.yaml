experiment:
  group: 2
  participant_id: "P001"

phases:
  - name: "Phase 1"
    reinforced_list: 1
    extinction_lists: []

  - name: "Phase 2"
    reinforced_list: 2
    extinction_lists: [1]

  - name: "Phase 3"
    reinforced_list: null
    extinction_lists: [1, 2, 3]

switching:
  min_correct: 15
  window_size: 10
  accuracy_threshold: 0.8
  max_trials: 100

trial:
  window_seconds: 3.0
  min_response_gap: 0.3
  iti_seconds: 0.5

lists:
  path: "list/"
  list1: "list1_animals.txt"
  list2: "list2_professions.txt"
  list3: "list3_foods.txt"

audio:
  reinforcement_sound: "audio/reward.wav"
  sample_rate: 16000
  channels: 1

asr:
  provider: "local"
  model_size: "base"
  beam_size: 5
  openai_model: "gpt-4o-transcribe"
  prefer_vocabulary_matches: true
  language: "en"

practice:
  enabled: true
  list: "list/list_practice.txt"
  max_trials: 20
  instruction: |
    Practice Round.
    
    Say the word shown on the screen.

instructions:
  intro: |
    Welcome.
    
    Say one word at a time.
    You will earn points for correct words.

  between_phases: |
    Please get ready.

  end: |
    The experiment is complete.

    Thank you for your participation!

data:
  db_path: "data/resurgence.db"
  export_csv: true