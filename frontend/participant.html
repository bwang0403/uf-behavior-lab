<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Participant Screen</title>
<style>
  :root {
    --bg: #07120f;
    --panel: #f7efe0;
    --ink: #10231d;
    --blue: #2d6cdf;
    --green: #0f9f6e;
    --amber: #d89018;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    overflow: hidden;
    color: var(--ink);
    font-family: "Trebuchet MS", "Gill Sans", sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(45, 108, 223, .34), transparent 32%),
      radial-gradient(circle at 82% 18%, rgba(15, 159, 110, .26), transparent 28%),
      linear-gradient(135deg, #07120f 0%, #10231d 54%, #1c150d 100%);
    display: grid;
    place-items: center;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(247, 239, 224, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(247, 239, 224, .055) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
    pointer-events: none;
  }

  #score-board {
    position: absolute;
    top: 30px;
    right: 40px;
    font-size: 28px;
    font-weight: bold;
    color: var(--green);
    z-index: 5;
    background: rgba(15, 159, 110, 0.1);
    padding: 10px 20px;
    border-radius: 999px;
  }

  .shell {
    position: relative;
    width: min(1120px, 92vw);
    min-height: min(720px, 88vh);
    display: grid;
    grid-template-columns: 1fr 500px;
    gap: 34px;
    align-items: center;
    z-index: 1;
  }

  .prompt-card {
    background: rgba(247, 239, 224, .96);
    border: 1px solid rgba(247, 239, 224, .5);
    border-radius: 34px;
    padding: clamp(34px, 5vw, 62px);
    min-height: 470px;
    box-shadow: 0 28px 90px rgba(0, 0, 0, .38);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(70px, 8vw, 110px);
    line-height: 1;
    letter-spacing: -.04em;
    color: var(--green);
    transition: opacity 0.2s;
  }

  .timer-card {
    position: relative;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
  }

  .timer-card svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 22px 35px rgba(0, 0, 0, .28));
  }

  .ring-bg { stroke: rgba(247, 239, 224, .16); }
  #arc {
    stroke: #ffffff;
    transition: stroke .25s ease, stroke-dashoffset .1s linear;
  }

  .time-cluster {
    position: relative;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(247, 239, 224, .94);
    box-shadow: inset 0 0 0 1px rgba(16, 35, 29, .08);
  }

  #time-display {
    display: none !important;
  }

  body[data-state="speak"] .prompt-card { animation: lift .42s ease both; }
  body[data-state="idle"] h1 { opacity: 0; }

  @keyframes lift {
    from { transform: translateY(14px); opacity: .9; }
    to { transform: translateY(0); opacity: 1; }
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 44px;
    background:
      radial-gradient(circle at 50% 30%, rgba(45, 108, 223, .24), transparent 36%),
      rgba(7, 18, 15, .96);
  }

  .overlay.show { display: flex; }

  .overlay-card {
    width: min(820px, 92vw);
    padding: clamp(34px, 5vw, 62px);
    border-radius: 34px;
    background: var(--panel);
    box-shadow: 0 34px 100px rgba(0, 0, 0, .42);
    text-align: center;
  }

  .overlay-card h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(42px, 6vw, 78px);
    letter-spacing: -.05em;
    line-height: .95;
  }

  #instruction-text {
    margin-top: 24px;
    color: #2f4238;
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1.5;
    white-space: pre-line;
  }
  
  #flash-zone {
    display: none;
    margin-top: 24px;
    min-height: 200px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  #participant-start-btn {
    margin-top: 40px;
    padding: 16px 48px;
    font-size: 26px;
    font-weight: bold;
    color: #fff;
    background-color: var(--green);
    border: none;
    border-radius: 99px;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(15, 159, 110, 0.3);
    transition: transform 0.2s, background-color 0.2s;
  }
  
  #participant-start-btn:hover {
    background-color: #0d8a5f;
    transform: translateY(-2px);
  }

  .flash-word {
    font-size: clamp(60px, 8vw, 120px);
    font-weight: bold;
    color: var(--blue);
    text-transform: uppercase;
    animation: fadeInOut 1s ease-in-out forwards;
  }

  @keyframes fadeInOut {
    0% { opacity: 0; transform: scale(0.95); }
    15% { opacity: 1; transform: scale(1); }
    85% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }

  #feedback-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .fb-correct {
    background: rgba(7, 18, 15, 0.95);
    color: #0f9f6e;
    font-size: clamp(80px, 12vw, 150px);
    font-weight: bold;
    font-family: Georgia, "Times New Roman", serif;
  }

  .fb-incorrect {
    background: #000000;
  }
</style>
</head>
<body data-state="idle">

<div id="score-board">Points: <span id="score-value">0</span></div>

<main class="shell" aria-live="polite">
  <section class="prompt-card">
    <h1 id="main-prompt"></h1>
  </section>

  <section class="timer-card" aria-label="response timer">
    <svg viewBox="0 0 520 520" aria-hidden="true">
      <circle class="ring-bg" cx="260" cy="260" r="210" fill="none" stroke-width="22"/>
      <circle id="arc" cx="260" cy="260" r="210" fill="none" stroke-width="22"
              stroke-dasharray="1319" stroke-dashoffset="1319" stroke-linecap="round"
              transform="rotate(-90 260 260)"/>
    </svg>
    <div class="time-cluster"></div>
  </section>
</main>

<div id="instruction-overlay" class="overlay">
  <div class="overlay-card">
    <h2 id="overlay-title"></h2>
    <div id="instruction-text"></div>
    <div id="flash-zone"></div>
    <button id="participant-start-btn">Continue</button>
  </div>
</div>

<div id="feedback-screen"></div>

<script>
const CIRC = 2 * Math.PI * 210;
const arc = document.getElementById('arc');
const mainPrompt = document.getElementById('main-prompt');
const instrOverlay = document.getElementById('instruction-overlay');
const overlayTitle = document.getElementById('overlay-title');
const instrText = document.getElementById('instruction-text');
const flashZone = document.getElementById('flash-zone');
const startBtn = document.getElementById('participant-start-btn');
const feedbackScreen = document.getElementById('feedback-screen');
const scoreValue = document.getElementById('score-value');

let windowSeconds = 3;
let timeLeft = 0;
let timerId = null;
let lastSeq = 0;
let score = 0;

let currentFlashWords = [];
let currentNeedsCountdown = false;
let abortFlash = false;

function shuffle(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function setState(state, promptText) {
  document.body.dataset.state = state;
  mainPrompt.textContent = promptText || '';
}

function renderArc(ratio) {
  arc.setAttribute('stroke-dashoffset', CIRC * (1 - ratio));
}

function startCycle(secs) {
  windowSeconds = secs || 3;
  timeLeft = windowSeconds;
  clearInterval(timerId);
  setState('speak', 'Speak now');
  renderArc(1);
  timerId = setInterval(() => {
    timeLeft = Math.max(0, timeLeft - 0.1);
    renderArc(timeLeft / windowSeconds);
    if (timeLeft <= 0) clearInterval(timerId);
  }, 100);
}

function stopCycle() {
  clearInterval(timerId);
  renderArc(0);
  setState('idle', '');
}

function flashWordsOneByOne(words, callback) {
  if (!words || words.length === 0 || abortFlash) {
    if (!abortFlash) callback();
    return;
  }
  overlayTitle.style.display = 'none';
  let i = 0;
  function showNext() {
    if (abortFlash) return;
    if (i >= words.length) {
      callback();
      return;
    }
    flashZone.innerHTML = `<div class="flash-word" id="active-flash">${words[i]}</div>`;
    const flashEl = document.getElementById('active-flash');
    flashEl.addEventListener('animationend', () => {
      i++;
      showNext();
    }, { once: true });
  }
  showNext();
}

startBtn.addEventListener('click', () => {
  startBtn.style.display = 'none';
  if (!currentNeedsCountdown) {
    instrOverlay.classList.remove('show');
    setState('idle', '');
    fetch('/participant_continue', { method: 'POST' }).catch(err => console.error(err));
    return;
  }
  
  instrText.style.display = 'none';
  flashZone.style.display = 'flex';
  
  if (currentFlashWords && currentFlashWords.length > 0) {
    let shuffled = shuffle(currentFlashWords);
    flashWordsOneByOne(shuffled, () => {
      instrOverlay.classList.remove('show');
      setState('idle', '');
      fetch('/participant_continue', { method: 'POST' }).catch(err => console.error(err));
    });
  } else {
    instrOverlay.classList.remove('show');
    setState('idle', '');
    fetch('/participant_continue', { method: 'POST' }).catch(err => console.error(err));
  }
});

function handleEvent(event, data) {
  switch(event) {
    case 'session_started':
      score = 0;
      scoreValue.textContent = score;
      setState('idle', '');
      break;
    case 'phase_change':
      if (data.mode === 'experiment' && data.phase === 1) {
        score = 0;
        scoreValue.textContent = score;
      }
      break;
    case 'cycle_start':
      abortFlash = true; 
      instrOverlay.classList.remove('show');
      flashZone.innerHTML = '';
      startCycle(data.window_seconds);
      break;
    case 'cycle_end':
      stopCycle();
      break;
    case 'iti_change':
      if (data.active) setState('idle', '');
      break;
    case 'feedback':
      if (data.correct) {
        score++;
        scoreValue.textContent = score;
        feedbackScreen.className = 'fb-correct';
        feedbackScreen.innerHTML = '<div>⭐</div><div>Correct</div>';
      } else {
        feedbackScreen.className = 'fb-incorrect';
        feedbackScreen.innerHTML = '';
      }
      feedbackScreen.style.display = 'flex';
      setTimeout(() => {
        feedbackScreen.style.display = 'none';
      }, 400);
      break;
    case 'instruction':
      abortFlash = false;
      clearInterval(timerId);
      renderArc(0);
      currentFlashWords = data.words || [];
      currentNeedsCountdown = !!data.needs_countdown;
      overlayTitle.textContent = data.title || "";
      overlayTitle.style.display = data.title ? 'block' : 'none';
      instrText.textContent = (data.text || '').trim();
      instrText.style.display = 'block';
      flashZone.style.display = 'none';
      flashZone.innerHTML = '';
      startBtn.textContent = currentNeedsCountdown ? "Start" : "Continue";
      startBtn.style.display = 'inline-block'; 
      instrOverlay.classList.add('show');
      setState('idle', '');
      if (!data.text || data.text.trim() === '') {
          overlayTitle.style.display = 'none';
          instrText.style.display = 'none';
          startBtn.click();
      }
      break;
    case 'instruction_done':
      instrOverlay.classList.remove('show');
      break;
    case 'pause_change':
      if (data.paused) {
        clearInterval(timerId);
        setState('idle', '');
      }
      break;
    case 'session_complete':
    case 'session_ended':
    case 'session_stopped':
      stopCycle();
      setState('idle', '');
      break;
  }
}

async function poll() {
  try {
    const r = await fetch('/poll?since=' + lastSeq);
    const events = await r.json();
    for (const e of events) {
      handleEvent(e.event, e.data || {});
      lastSeq = Math.max(lastSeq, e.seq);
    }
  } catch(_) {}
  setTimeout(poll, 200);
}

setState('idle', '');
renderArc(0);
poll();
</script>
</body>
</html>
