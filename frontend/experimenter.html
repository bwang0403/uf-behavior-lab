<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Experimenter Panel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f; color: #f0f0f8;
    font-family: 'Courier New', monospace;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding-bottom: 28px;
  }
  header {
    width: 100%; background: #12121a; border-bottom: 1px solid #2a2a3a;
    padding: 18px 28px; display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 12px; color: #4f8fff; letter-spacing: 2px; }
  #dot { font-size: 14px; color: #5a5a7a; transition: color 0.3s; }
  .card { background: #1a1a26; border-radius: 8px; padding: 18px 24px; width: 460px; margin-top: 18px; }
  .stat-row { display: flex; align-items: baseline; padding: 6px 0; }
  .stat-label { font-size: 10px; color: #5a5a7a; width: 148px; letter-spacing: 1px; flex-shrink: 0; }
  .stat-value { font-size: 14px; font-weight: bold; color: #f0f0f8; }
  .divider { width: 460px; height: 1px; background: #2a2a3a; margin-top: 14px; }
  #status-bar { width: 460px; margin-top: 10px; font-size: 11px; color: #5a5a7a; text-align: center; letter-spacing: 1px; min-height: 18px; }
  .btn-row { display: flex; gap: 10px; width: 460px; margin-top: 10px; }
  button {
    flex: 1; padding: 13px 0; border: none; border-radius: 6px;
    font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold;
    letter-spacing: 1px; cursor: pointer; transition: background .2s, color .2s, opacity .15s;
  }
  button:disabled { opacity: .3; cursor: not-allowed; }
  #btn-start { background: #3ddc84; color: #0a0a0f; }
  #btn-stop  { background: #1a1a26; color: #5a5a7a; }
  #btn-pause { background: #1a1a26; color: #5a5a7a; }
  #btn-next  { background: #1a1a26; color: #5a5a7a; }
  #btn-continue {
    display: none; width: 460px; padding: 13px 0; background: #4f8fff; color: #0a0a0f;
    border: none; border-radius: 6px; font-family: 'Courier New', monospace;
    font-size: 11px; font-weight: bold; letter-spacing: 1px; cursor: pointer; margin-top: 10px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
  #summary {
    display: none; width: 460px; background: #12121a; border: 1px solid #2a2a3a;
    border-radius: 8px; padding: 16px 22px; margin-top: 14px;
    font-size: 11px; line-height: 1.9; white-space: pre; color: #f0f0f8;
  }
  footer { margin-top: auto; padding-top: 24px; font-size: 9px; color: #2a2a3a; letter-spacing: 1px; text-align: center; }
</style>
</head>
<body>
<header><h1>RESURGENCE EXPERIMENT</h1><span id="dot">●</span></header>

<div class="card">
  <div class="stat-row"><span class="stat-label">PARTICIPANT</span> <span class="stat-value" id="v-pid">—</span></div>
  <div class="stat-row"><span class="stat-label">GROUP</span>        <span class="stat-value" id="v-grp">—</span></div>
  <div class="stat-row"><span class="stat-label">PHASE</span>        <span class="stat-value" id="v-phase">—</span></div>
  <div class="stat-row"><span class="stat-label">CYCLE</span>        <span class="stat-value" id="v-cycle">—</span></div>
  <div class="stat-row"><span class="stat-label">LAST RESPONSE</span><span class="stat-value" id="v-resp">—</span></div>
  <div class="stat-row"><span class="stat-label">REMAINING</span>    <span class="stat-value" id="v-rem">—</span></div>
</div>

<div class="divider"></div>
<div id="status-bar">CONNECTING...</div>

<div class="btn-row">
  <button id="btn-start" onclick="startSession()" disabled>▶ START SESSION</button>
  <button id="btn-stop"  onclick="post('stop')"   disabled>■ STOP</button>
</div>
<div class="btn-row">
  <button id="btn-pause" onclick="post('pause')"      disabled>⏸ PAUSE</button>
  <button id="btn-next"  onclick="post('next_phase')" disabled>⏭ NEXT PHASE</button>
</div>
<button id="btn-continue" onclick="acknowledge()">▶▶ CONTINUE — click when participant is ready</button>
<div id="summary"></div>
<footer>data saved to data/ &nbsp;|&nbsp; participant screen → /participant</footer>

<script>
const $ = id => document.getElementById(id);
let lastSeq = 0;

// ── Polling ───────────────────────────────────────────────────────────────────
async function poll() {
  try {
    const r = await fetch('/poll?since=' + lastSeq);
    const events = await r.json();
    for (const e of events) {
      handleEvent(e.event, e.data);
      lastSeq = Math.max(lastSeq, e.seq);
    }
  } catch(_) {}
  setTimeout(poll, 200);
}

function handleEvent(event, data) {
  switch (event) {
    case 'model_status':
      if (data.ready) {
        setBtn('btn-start', true, '#3ddc84', '#0a0a0f');
        setStatus('MODEL READY — click START SESSION', '#3ddc84');
      } else {
        setStatus('LOADING WHISPER MODEL...', '#e0a020');
      }
      break;
    case 'session_started':
      setRunning(true); setStatus('● RUNNING', '#3ddc84'); break;
    case 'session_stopped':
    case 'session_ended':
      setRunning(false); setStatus('STOPPED'); break;
    case 'status_update':
      $('v-phase').textContent = data.phase;
      $('v-cycle').textContent = data.cycle;
      $('v-resp').textContent  = data.last_response;
      $('v-rem').textContent   = data.remaining;
      break;
    case 'pause_change':
      if (data.paused) {
        $('btn-pause').textContent = '▶ RESUME';
        setBtn('btn-pause', true, '#3ddc84', '#0a0a0f');
        setStatus('⏸  PAUSED', '#e0a020');
      } else {
        $('btn-pause').textContent = '⏸ PAUSE';
        setBtn('btn-pause', true, '#e0a020', '#0a0a0f');
        setStatus('● RUNNING', '#3ddc84');
      }
      break;
    case 'instruction':
      $('btn-continue').style.display = 'block';
      setStatus('INSTRUCTION SCREEN — click CONTINUE when ready', '#4f8fff');
      break;
    case 'instruction_done':
      $('btn-continue').style.display = 'none';
      setStatus('● RUNNING', '#3ddc84');
      break;
    case 'session_complete':
      const s = data.summary;
      const lines = ['─── Session Summary ───────────────────'];
      for (const [ph, info] of Object.entries(s.phases).sort())
        lines.push(`  Phase ${ph}:  ${info.responses} / ${info.cycles} cycles  (${(info.response_rate*100).toFixed(0)}%)`);
      lines.push(`  Total cycles:  ${s.total_cycles}`);
      lines.push(`  Resurgence:    ${s.resurgence_count}  (List-1 in Phase 3)`);
      lines.push('───────────────────────────────────────');
      $('summary').textContent = lines.join('\n');
      $('summary').style.display = 'block';
      setStatus('SESSION COMPLETE', '#4f8fff');
      break;
    case 'server_error':
      setStatus('ERROR: ' + data.message, '#ff5f57'); break;
  }
}

// ── Commands ──────────────────────────────────────────────────────────────────
async function post(action) {
  try {
    const r = await fetch('/cmd/' + action, { method: 'POST' });
    if (!r.ok) { const d = await r.json(); setStatus('ERROR: ' + (d.error || r.status), '#ff5f57'); }
  } catch(e) { setStatus('Network error', '#ff5f57'); }
}

function startSession() {
  setBtn('btn-start', false, '#1a1a26', '#5a5a7a');
  post('start');
}
function acknowledge() {
  $('btn-continue').style.display = 'none';
  post('acknowledge');
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function setStatus(text, color='#5a5a7a') {
  $('status-bar').textContent = text; $('status-bar').style.color = color; $('dot').style.color = color;
}
function setBtn(id, enabled, bg, fg) {
  const b=$(id); b.disabled=!enabled; b.style.background=bg; b.style.color=fg;
}
function setRunning(on) {
  setBtn('btn-start', !on, on?'#1a1a26':'#3ddc84', on?'#5a5a7a':'#0a0a0f');
  setBtn('btn-stop',   on, on?'#ff5f57':'#1a1a26', on?'#0a0a0f':'#5a5a7a');
  setBtn('btn-pause',  on, on?'#e0a020':'#1a1a26', on?'#0a0a0f':'#5a5a7a');
  setBtn('btn-next',   on, on?'#4f8fff':'#1a1a26', on?'#0a0a0f':'#5a5a7a');
}

// ── Init ─────────────────────────────────────────────────────────────────────
fetch('/config').then(r=>r.json()).then(cfg => {
  $('v-pid').textContent = cfg.participant_id;
  $('v-grp').textContent = cfg.group + '-list';
  // Restore model status if already loaded
  if (cfg.model_ready) {
    setBtn('btn-start', true, '#3ddc84', '#0a0a0f');
    setStatus('MODEL READY — click START SESSION', '#3ddc84');
  } else {
    setStatus('LOADING WHISPER MODEL...', '#e0a020');
  }
});
poll();  // start polling
</script>
</body>
</html>
